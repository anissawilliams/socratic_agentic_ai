# Round 2 final survey (finalized items). Participant-facing wording.
# Bump `version` on any change. All items are required.

key: final_survey
version: 1.0.0

scale:
  - Strongly disagree
  - Disagree
  - Neutral
  - Agree
  - Strongly agree

intro: Please indicate how much you agree or disagree with each statement.

likert:
  - id: likert_1
    prompt: The AI interaction helped me understand the material better.
  - id: likert_2
    prompt: I felt engaged during the AI interaction.
  - id: likert_3
    prompt: The AI interaction made me think carefully about the material.
  - id: likert_4
    prompt: The AI interaction encouraged me to explain my reasoning.
  - id: likert_5
    prompt: The AI interaction made me reconsider my thinking when appropriate.
  - id: likert_6
    prompt: I feel confident that I could explain the material to someone else.

open:
  - id: open_response
    prompt: >-
      Compared to your usual interactions with other AI tools (such as
      ChatGPT, Gemini, Claude, etc.), did you notice anything different about
      the AI interaction in this activity? If so, please describe what you
      noticed. If not, please indicate that you did not notice any
      differences.
  - id: open_response_2
    prompt: >-
      In what ways, if any, did the AI interaction influence how you
      approached the problem, evaluated different options, or developed your
      reasoning? Please provide an example if possible.
