    prompt: What information or evidence is most important in reaching your recommendation, and why?
  - id: pre_q3
    construct: counterargument
    prompt: What is the strongest concern or argument against your recommendation?
  - id: pre_q4
    construct: uncertainty_revision
    prompt: What uncertainty or new information could change your decision?
posttest:
  scenario_key: employee_system_access
  scenario_version: 1.0.0
  scenario_title: Managing Employee System Access with AI
  scenario_text: |-
    A company with approximately 2,500 employees receives around 1,200 requests each month to create, change, or remove employee access to internal software systems. The company is considering an AI system that reviews employee roles, retrieves access policies, recommends appropriate permissions, and initiates approved access changes.

    The system was tested on 400 employee access requests:

    • For 335 requests, the AI's recommendations matched those made by experienced IT administrators.
    • In 36 cases, the AI recommended granting employees broader access than their job responsibilities required.
    • An automated access control check blocked 28 of these 36 recommendations. The remaining eight were identified during human review.
    • Approximately 40 requests involved employee records that had not been updated to reflect recent changes in job responsibilities.
    • The AI could generate an access recommendation in approximately four minutes, compared with 25 minutes for manual review. However, obtaining the necessary manager approval sometimes required several additional hours.
    • The system recorded its recommendations, but the pilot did not consistently capture which manager authorized each change. The testing also included relatively few requests involving highly sensitive internal systems.

    The company must decide how much authority to give the AI system, which access decisions should require human approval, and whether its current performance and safeguards justify broader deployment.
    Task: Based only on the information above, recommend what the company should do.
