pretest:
  scenario_key: invoice_reconciliation
  scenario_version: 1.0.0
  scenario_title: Automating Invoice Reconciliation with AI
  scenario_text: |-
    A wholesale company processes approximately 4,000 supplier invoices each month. The company is considering an AI system that extracts invoice information, compares it with purchase orders and delivery records, identifies discrepancies, and recommends whether invoices should be approved for payment or flagged for further review.

    The company tested the system on 600 invoices:

    • For 495 invoices, the AI's recommendations were consistent with decisions made by experienced finance staff.
    • Among 52 invoices with missing delivery confirmations, the AI recommended approving payment for 17.
    • In 21 cases, the AI relied on outdated supplier information, raising concerns about the accuracy of its recommendations.
    • An automated validation rule identified 11 of the 17 potentially premature payment approvals. The remaining six were identified during human review before payments were processed.
    • The AI could prepare an invoice recommendation in approximately two minutes, compared with eight minutes for manual processing. However, human approval added an average of five minutes to the AI-assisted process.
    • The pilot included relatively few invoices involving complicated purchase orders or unusual payment arrangements, so the system's reliability in these situations remains uncertain.

    The company must decide whether to expand the system, permit automatic approval of certain invoices, require human verification, or improve the system before using it more broadly.
    Task: Based only on the information above, recommend what the company should do.
  questions:
  - id: pre_q1
    construct: recommendation
    prompt: What do you recommend?
  - id: pre_q2
