# Round 1 near-transfer instrument (finalized scenarios, Version 2).
# Pretest: Targeting Energy Assistance. Posttest: Planning Cooling Centers
# During Extreme Heat (replaced Reducing City Traffic in 1.1.0, when the
# instrument key was renamed from round1_energy_traffic).
# Bump `version` (and the scenario_version that changed) on ANY text edit.

key: round1_energy_cooling
version: 1.1.0
status: active
transfer_type: near
cohort: round1

# Both AI conditions discuss the pretest scenario. The tutor must never
# receive the learner's pretest answers.
tutor_scenario_key: energy_assistance

pretest:
  scenario_key: energy_assistance
  scenario_version: 1.0.0
  scenario_title: Targeting Energy Assistance
  scenario_text: |-
    A regional government provides winter energy assistance to 10,000 eligible low-income households, but its current budget allows it to provide enhanced assistance to only 400 households this year.

    The government is considering a data-driven system to help identify households most likely to experience severe energy hardship. The system was tested on a random sample of 3,000 eligible households:

    • 600 were classified as "high risk"; 420 later experienced severe energy hardship.
    • 2,400 were classified as "lower risk"; 180 later experienced severe energy hardship.
    • Historically, about 20% of eligible households experience severe energy hardship each winter.
    • The current system only classifies households as "high risk" or "lower risk"; it does not rank households within each group.
    • Immigrant households were flagged more often than other households. Officials have not yet determined whether this reflects differences in actual economic vulnerability or differences in the model's error rates across groups.

    The government must decide whether to use the system now, modify or test it further, or combine it with other criteria when allocating the 400 available assistance slots.

    Task: Based only on the information above, recommend what the government should do.
  questions:
    - id: pre_q1
      construct: recommendation
      prompt: What do you recommend?
    - id: pre_q2
      construct: evidence_reasoning
      prompt: What information or evidence is most important in reaching your recommendation, and why?
    - id: pre_q3
      construct: counterargument
      prompt: What is the strongest concern or argument against your recommendation?
    - id: pre_q4
      construct: uncertainty_revision
      prompt: What uncertainty or new information could change your decision?

posttest:
  scenario_key: cooling_centers
  scenario_version: 1.0.0
  scenario_title: Planning Cooling Centers During Extreme Heat
  scenario_text: |-
    A city of 500,000 residents across 20 neighborhoods is preparing for increasingly severe summer heatwaves. Its budget allows it to operate five cooling centers during periods of extreme heat.

    The city has developed a data-driven risk model to help decide where the centers should be located. The model uses neighborhood temperature, age of residents, housing conditions, and past heat-related emergency visits.

    Based on current data:

    • Seven neighborhoods are predicted to face particularly high heat-related risk next summer.
    • Five of those seven were also among the neighborhoods with the highest rates of heat-related emergency visits last summer.
    • However, two neighborhoods that experienced high emergency rates last summer are not classified as high risk for next summer.
    • Several high-risk neighborhoods have larger populations of older and lower-income residents.
    • Some of these neighborhoods also have limited public transportation, which could make reaching a cooling center difficult.
    • Officials are concerned that relying on past emergency visits may not fully represent vulnerability because some residents may be less likely or able to seek medical care.

    The city must decide how to use the model and other available information to choose the five neighborhoods that should receive cooling centers.

    Task: Based only on the information above, recommend how the city should make its decision.
  questions:
    - id: post_q1
      construct: recommendation
      prompt: What do you recommend?
    - id: post_q2
      construct: evidence_reasoning
      prompt: What information or evidence is most important in reaching your recommendation, and why?
    - id: post_q3
      construct: counterargument
      prompt: What is the strongest concern or argument against your recommendation?
    - id: post_q4
      construct: uncertainty_revision
      prompt: What uncertainty or new information could change your decision?
