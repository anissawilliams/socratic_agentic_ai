[lint.isort]
known-first-party = ["app", "scripts"]

[lint.flake8-bugbear]
# Calling Depends()/Header() in a parameter default is how FastAPI declares
# dependencies, not the mutable-default bug B008 is meant to catch.
extend-immutable-calls = [
    "fastapi.Body",
    "fastapi.Depends",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Query",
]
